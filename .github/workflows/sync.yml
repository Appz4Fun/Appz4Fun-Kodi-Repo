name: Build & Deploy Kodi Repository

on:
  schedule:
    - cron: "17 4 * * *"        # daily at 04:17 UTC
  workflow_dispatch: {}
  repository_dispatch:
    types: [addon-released]      # instant trigger from source repo CI
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "build/**"
      - "assets/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub turns off a scheduled workflow after 60 days without repository
  # activity, and a turned-off workflow also ignores the addon-released
  # repository_dispatch, so new add-on releases would silently stop
  # publishing. Re-enabling it on every scheduled run resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Reset the inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Restore asset cache
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: kodi-assets-${{ github.run_id }}
          restore-keys: |
            kodi-assets-
      - name: Build repository
        env:
          # SOURCES_TOKEN (optional): fine-grained PAT with Contents: read on
          # any PRIVATE source repos listed in sources.json. The default
          # workflow token can only read public sources; without SOURCES_TOKEN
          # a private source is skipped with a WARN rather than published.
          GITHUB_TOKEN: ${{ secrets.SOURCES_TOKEN || secrets.GITHUB_TOKEN }}
        run: python build/build_repo.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
